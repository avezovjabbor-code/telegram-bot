<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Kalkulyator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Orqa fon nurlari -->
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <div class="calc-wrapper">
        <!-- Yuqori panel -->
        <div class="top-bar">
            <button class="icon-btn" id="themeBtn" title="Mavzuni o'zgartirish" aria-label="Mavzuni o'zgartirish">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <span class="app-title">Kalkulyator</span>
            <button class="icon-btn" id="historyBtn" title="Hisoblash tarixi" aria-label="Hisoblash tarixi">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </button>
        </div>

        <!-- Displey -->
        <div class="display-container">
            <div class="prev-operation" id="prevOp"></div>
            <div class="current-input" id="currInput">0</div>
        </div>

        <!-- Tugmalar bloki -->
        <div class="keypad">
            <button class="btn btn-spec" data-action="clear">AC</button>
            <button class="btn btn-spec" data-action="delete">⌫</button>
            <button class="btn btn-op" data-action="percent">%</button>
            <button class="btn btn-op" data-operator="÷">÷</button>

            <button class="btn btn-num" data-num="7">7</button>
            <button class="btn btn-num" data-num="8">8</button>
            <button class="btn btn-num" data-num="9">9</button>
            <button class="btn btn-op" data-operator="×">×</button>

            <button class="btn btn-num" data-num="4">4</button>
            <button class="btn btn-num" data-num="5">5</button>
            <button class="btn btn-num" data-num="6">6</button>
            <button class="btn btn-op" data-operator="-">-</button>

            <button class="btn btn-num" data-num="1">1</button>
            <button class="btn btn-num" data-num="2">2</button>
            <button class="btn btn-num" data-num="3">3</button>
            <button class="btn btn-op" data-operator="+">+</button>

            <button class="btn btn-num btn-zero" data-num="0">0</button>
            <button class="btn btn-num" data-action="decimal">.</button>
            <button class="btn btn-equal" data-action="calculate">=</button>
        </div>

        <div class="keyboard-hint">Klaviatura orqali ham kiritish mumkin</div>

        <!-- Tarix (History) Oynasi -->
        <div class="history-overlay" id="historyOverlay">
            <div class="history-header">
                <h3>Hisoblashlar tarixi</h3>
                <button class="icon-btn" id="closeHistoryBtn" aria-label="Yopish">✕</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: var(--text-muted); margin-top: 30px;">Hozircha tarix mavjud emas</div>
            </div>
            <button class="clear-hist-btn" id="clearHistoryBtn">Tarixni tozalash</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
